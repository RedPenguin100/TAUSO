name: Build and Test Python

on:
  push:
    branches: [ main, 'v[0-9]*' ]
  pull_request:
    branches: [ main, 'v[0-9]*' ]
  schedule:
    - cron: '0 3 * * *' # 3:00 AM UTC -> 6:00 AM Israel Daylight Time

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: conda-linux-64-dev.lock
          environment-name: tauso
          cache-downloads: true
          cache-environment: true
          cache-environment-key: ${{ runner.os }}-tauso-${{ hashFiles('conda-linux-64-dev.lock') }}

      - name: Run Ruff Check (Linting)
        run: micromamba run -n tauso ruff check src/

      - name: Run Ruff Format (Style)
        run: micromamba run -n tauso ruff format --check src/

      - name: Type check (mypy, informational — non-blocking)
        continue-on-error: true
        run: |
          micromamba run -n tauso uv pip install mypy
          micromamba run -n tauso mypy || true

      # Catches notebooks importing a name that no longer exists in the tauso
      # package (e.g. a renamed/removed helper) without executing any notebook.
      # Informational only.
      - name: Type check notebooks (mypy, informational — non-blocking)
        continue-on-error: true
        run: |
          micromamba run -n tauso uv pip install mypy
          MYPYPATH=src micromamba run -n tauso mypy \
            --follow-imports=silent \
            --ignore-missing-imports \
            --explicit-package-bases \
            --namespace-packages \
            notebooks/ || true

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    env:
      TAUSO_DATA_DIR: /home/runner/.tauso_data

    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Free Disk Space
        # Intentionally no `wait` — deletions run in the background while
        # checkout and micromamba proceed. This is safe in practice because
        # by the time Bowtie cache restore needs the space, the rms are done.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" &
          echo "Deletions running in background. Current disk:"
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Create Data Directory
        run: mkdir -p "${{ env.TAUSO_DATA_DIR }}"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: conda-linux-64-dev.lock
          environment-name: tauso
          cache-downloads: true
          cache-environment: true
          cache-environment-key: ${{ runner.os }}-tauso-${{ hashFiles('conda-linux-64-dev.lock') }}

      # No uv cache here on purpose. It held ~1.9 GB and was duplicated per PR ref
      # (a run reads caches from the default branch but saves to refs/pull/N/merge),
      # which pushed the repo past the 10 GB cache quota and evicted the genome and
      # bowtie caches — a miss there costs ~15 minutes, far more than this saves.
      - name: Install tauso
        run: micromamba run -n tauso uv pip install -e ".[dev]"

      # Fail fast on import errors before the expensive data setup.
      - name: Collect tests (fail fast on import errors)
        run: micromamba run -n tauso pytest --collect-only -q

      - name: Cache Genome Database
        id: cache-genome
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.gff3.db
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.gff3.db.success
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.gtf.db
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.gtf.db.success
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.fa
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.fa.fai
            ${{ env.TAUSO_DATA_DIR }}/GRCh38.gtf.gz
          key: ${{ runner.os }}-tauso.genome-GRCh38-v6

      # The coordinate-only locus pickle that `setup-genome` builds from the gff db.
      # Its own cache, keyed on the module that defines the pickle layout and
      # _LOCUS_CACHE_VERSION, so bumping that constant invalidates this entry and the
      # rebuilt pickle gets saved. Keying it with the genome files instead would mean
      # every edit to that module also re-downloads GRCh38.
      # The loader rebuilds the pickle whenever it is older than GRCh38.gff3.db;
      # actions/cache preserves mtimes, and a newer gff db *should* force a rebuild.
      - name: Cache locus pickle
        uses: actions/cache@v4
        with:
          path: ${{ env.TAUSO_DATA_DIR }}/GRCh38.locus.*.pkl
          key: ${{ runner.os }}-tauso.locus-${{ hashFiles('src/tauso/genome/read_human_genome.py') }}

      - name: Install genome
        run: tauso setup-genome

      - name: Cache and Setup Bowtie
        uses: ./.github/actions/setup-bowtie-cached
        with:
          os: ${{ runner.os }}
          data_dir: ${{ env.TAUSO_DATA_DIR }}

      # Only the immutable Zenodo download is cached, not the tables derived from it: those are
      # rebuilt from repo code (split, gene corrections, indexing) in seconds, and caching them
      # would let a code change keep reading stale outputs.
      - name: Cache raw Oligo dataset
        uses: actions/cache@v4
        with:
          path: notebooks/data/OligoAI/raw_data/aso_inhibitions_21_08_25_incl_context_w_flank_50_df.csv.gz
          key: oligo-raw-zenodo-20794660

      - name: Build Oligo Data (download, split, canonical gene, index)
        run: python notebooks/data/OligoAI/setup_data.py --skip-process

      - name: Cache mRNA Half Life
        uses: actions/cache@v4
        with:
          path: ${{ env.TAUSO_DATA_DIR }}/mrna_half_life.parquet
          key: mrna-halflife-v2

      - name: Setup mRNA half life
        run: tauso setup-mrna-halflife

      - name: Cache ATtRACT RBP data
        uses: actions/cache@v4
        with:
          path: ${{ env.TAUSO_DATA_DIR }}/attract
          key: attract-zenodo-20366079

      - name: Setup ATtRACT RBP data
        run: tauso setup-attract

      - name: Cache RiboSeq data
        uses: actions/cache@v4
        with:
          path: ${{ env.TAUSO_DATA_DIR }}/human_unselected_40S.RiboProElong.bw
          key: riboseq-zenodo-20366983

      - name: Setup RiboSeq data
        run: tauso setup-riboseq

      - name: Cache DepMap Data
        id: cache-depmap
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TAUSO_DATA_DIR }}/Model.csv
            ${{ env.TAUSO_DATA_DIR }}/OmicsProfiles.csv
            ${{ env.TAUSO_DATA_DIR }}/OmicsExpressionTPMLogp1HumanAllGenesStranded.parquet
            ${{ env.TAUSO_DATA_DIR }}/OmicsExpressionTPMLogp1HumanAllGenesStranded.parquet.sha256
            ${{ env.TAUSO_DATA_DIR }}/processed_expression
          key: depmap-25Q3-v5

      - name: Setup DepMap
        run: tauso setup-depmap

      - name: Cache human tGCN
        uses: actions/cache@v4
        with:
          path: ${{ env.TAUSO_DATA_DIR }}/human_tgcn_hsapi38.csv
          key: human-tgcn-hsapi38-v1

      - name: Build cell context (default cohort + expression + CAI weights + tGCN)
        run: tauso build-cell-context

      # Both the Parquet and the per-cell-line files, because each command below skips its
      # own work when its own output is restored. On a miss the Parquet costs a 4.3 GB CSV
      # download; the CSV itself is deleted after conversion and never cached.
      - name: Cache transcript expression
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TAUSO_DATA_DIR }}/OmicsExpressionTranscriptTPMLogp1HumanAllGenes.parquet
            ${{ env.TAUSO_DATA_DIR }}/OmicsExpressionTranscriptTPMLogp1HumanAllGenes.parquet.sha256
            ${{ env.TAUSO_DATA_DIR }}/processed_transcript_expression
          key: transcript-expression-25Q3-v1

      - name: Setup DepMap transcripts
        run: tauso setup-depmap-transcripts

      # Must follow build-cell-context, which writes the cohort manifest this is built
      # against. The command reports missing inputs on stdout and still exits 0, so assert
      # the output exists: a silent failure here just puts the transcript tests back to
      # skipping, which is what this exists to stop.
      - name: Build cohort transcript expression
        run: |
          tauso build-cohort-transcript-expression
          test -d "$TAUSO_DATA_DIR/processed_transcript_expression"

      - name: Cache rRNA reference
        uses: actions/cache@v4
        with:
          path: ${{ env.TAUSO_DATA_DIR }}/rrna_reference.fa
          key: rrna-reference-21071791

      - name: Setup rRNA reference (off-target)
        run: tauso setup-rrna

      # The bundled model is trained on the ten fold_access_* features, which no
      # longer exist, so nothing in the suite scores with it. Restore both steps
      # when the replacement accessibility family is in and the model retrained.
      # - name: Cache model
      #   uses: actions/cache@v4
      #   with:
      #     path: ${{ env.TAUSO_DATA_DIR }}/models
      #     key: tauso-model-21394367-65e184e0
      #
      # - name: Setup model (tauso_score)
      #   run: tauso setup-model

      - name: Run tests
        # -n 2 with --dist loadfile: every test in a file goes to the same worker, so
        # the module-scoped fixtures (structure_data, gene_to_data) are built once per
        # file instead of once per worker. -n 4 with the default round-robin rebuilt
        # them on every worker and came out slower than running serially.
        # --n-jobs 2 keeps each worker's internal parallelism from oversubscribing the
        # runner's 4 cores. The parallel feature path stays covered by
        # test_mfe_parallel_matches_baseline, which hardcodes n_jobs=4.
        # log_cli streams DEBUG for every test, which under xdist interleaves the
        # workers into unreadable output. log_level=DEBUG instead captures the same
        # lines and prints them under "Captured log call" for the tests that fail,
        # attributed to the right test and worker. Without it there is no captured
        # log section at all.
        run: >-
          micromamba run -n tauso pytest -q --durations=15 -n 2 --dist loadfile --n-jobs 2
          -o log_cli=false -o log_level=DEBUG
